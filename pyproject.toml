[project]
name = "lhagent"
version = "1.0.0"
description = "A coding agent with persistent sessions and tool execution"
readme = "README.md"
authors = [
    { name = "kongweiduo", email = "victorkong355@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.19.0",
    "python-dotenv>=1.2.3",
    "prompt-toolkit>=3.0.51,<4",
]

[project.scripts]
lhagent = "lhagent:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
